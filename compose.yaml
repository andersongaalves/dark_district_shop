# Banco de desenvolvimento opcional. API e frontend continuam com seus comandos existentes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dd
      POSTGRES_DB: dark_district
      POSTGRES_PASSWORD: ${DD_POSTGRES_PASSWORD:?Defina DD_POSTGRES_PASSWORD no arquivo de ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dd_support_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dd -d dark_district"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  dd_support_postgres:
